generic-service:
  nameOverride: hmpps-community-accommodation-tier-2-ui
  productId: 'HMPPS531'
  # the IRSA service account name for accessing AWS resources
  serviceAccountName: hmpps-community-accommodation-tier-2-service-account
  replicaCount: 4

  image:
    repository: ghcr.io/ministryofjustice/hmpps-community-accommodation-tier-2-ui
    tag: app_version # override at deployment time
    port: 3000

  ingress:
    enabled: true
    host: app-hostname.local # override per environment
    tlsSecretName: hmpps-community-accommodation-tier-2-ui-cert

  livenessProbe:
    httpGet:
      path: /ping

  readinessProbe:
    httpGet:
      path: /ping

  custommetrics:
    enabled: true
    scrapeInterval: 15s
    metricsPath: /metrics
    metricsPort: 3001

  # Environment variables to load into the deployment
  env:
    NODE_ENV: "production"
    LOG_LEVEL: "info"
    REDIS_TLS_ENABLED: "true"
    TOKEN_VERIFICATION_ENABLED: "true"
    COMMUNITY_ACCOMMODATION_API_SERVICE_NAME: "community-accommodation-tier-2"
    AUDIT_SERVICE_NAME: 'hmpps-community-accommodation-tier-2-ui'
    AUDIT_SQS_REGION: 'eu-west-2'

  # Pre-existing kubernetes secrets to load as environment variables in the deployment.
  # namespace_secrets:
  #   [name of kubernetes secret]:
  #     [name of environment variable as seen by app]: [key of kubernetes secret to load]

  namespace_secrets:
    hmpps-community-accommodation-tier-2-ui:
      API_CLIENT_ID: "API_CLIENT_ID"
      API_CLIENT_SECRET: "API_CLIENT_SECRET"
      SYSTEM_CLIENT_ID: "SYSTEM_CLIENT_ID"
      SYSTEM_CLIENT_SECRET: "SYSTEM_CLIENT_SECRET"
      SESSION_SECRET: "SESSION_SECRET"
      SENTRY_DSN: 'SENTRY_DSN'
    elasticache-redis:
      REDIS_HOST: "primary_endpoint_address"
      REDIS_AUTH_TOKEN: "auth_token"
    hmpps-community-accommodation-tier-2-ui-application-insights:
      APPLICATIONINSIGHTS_CONNECTION_STRING: "APPLICATIONINSIGHTS_CONNECTION_STRING"

  # we use MFA so having no allow list is acceptable
  allowlist: null

generic-prometheus-alerts:
  targetApplication: hmpps-community-accommodation-tier-2-ui
